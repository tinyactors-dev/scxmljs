# Releases @tinyactors/scxmljs. All the work happens in scripts/publish: the full release check,
# then `npm stage publish` via trusted publishing; a maintainer approves the staged version with
# 2FA on npmjs.com. npm's trusted-publisher settings must name this file: release.yml.
#
# Two ways in:
#   - a push to main that changes packages/scxmljs/package.json (or "Run workflow" on main): when
#     its version has no tag yet, scripts/publish checks it, tags it, stages it and starts site.yml
#     (a tag pushed with the workflow's own token starts no workflows, so it starts the site itself)
#   - a pushed v* tag (a maintainer tagged by hand): checks and stages it; site.yml runs on the tag
name: release
on:
  push:
    branches: [main]
    paths: ["packages/scxmljs/package.json"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write # push the tag
  id-token: write # npm trusted publishing
  actions: write # start site.yml for a tag made here
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/publish
        env:
          GH_TOKEN: ${{ github.token }}
